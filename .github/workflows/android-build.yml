name: Build Android APK

on:
  push:
    branches:
      - claude/second-brain-app-build-v1zKV
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    # Required to publish the release below. Without it the release step gets
    # "403 Resource not accessible by integration" — which is what broke the
    # download link: no release was ever created, so the URL 404'd.
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 36
          build-tools: 36.0.0
          ndk-version: '26.1.10909125'

      - name: Install dependencies
        run: npm install

      - name: Build web assets
        run: npm run build

      - name: Copy web assets to Android
        run: |
          mkdir -p android/app/src/main/assets/public
          cp -r dist/* android/app/src/main/assets/public/

      - name: Generate Capacitor config
        run: |
          mkdir -p android/app/src/main/assets
          cat > android/app/src/main/assets/capacitor.config.json << 'EOF'
          {
            "appId": "com.eddenbg.secondbrain",
            "appName": "Second Brain",
            "webDir": "public",
            "server": {
              "androidScheme": "https"
            },
            "plugins": {
              "Filesystem": {
                "directory": "Documents"
              }
            }
          }
          EOF

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Build Android APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK to Release
        uses: actions/upload-artifact@v4
        with:
          name: app-debug.apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      # Publish the APK to a stable public release so it can be downloaded
      # without signing in to GitHub. Artifacts (above) always require a login;
      # release assets on a public repo do not.
      - name: Publish APK to "latest-build" release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: latest-build
          name: Latest Build
          body: |
            Latest automatic build of the Second Brain Android app.

            **Download `app-debug.apk` below** — no GitHub account needed.

            Built from commit ${{ github.sha }}.
          files: android/app/build/outputs/apk/debug/app-debug.apk
          make_latest: true
