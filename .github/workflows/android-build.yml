name: Build Android APK

on:
  push:
    branches:
      - claude/second-brain-app-build-v1zKV
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 36
          build-tools: 36.0.0
          ndk-version: '26.1.10909125'

      - name: Install dependencies
        run: npm install

      - name: Build web assets
        run: npm run build

      - name: Copy web assets to Android
        run: |
          mkdir -p android/app/src/main/assets/public
          cp -r dist/* android/app/src/main/assets/public/

      - name: Generate Capacitor config
        run: |
          mkdir -p android/app/src/main/assets
          cat > android/app/src/main/assets/capacitor.config.json << 'EOF'
          {
            "appId": "com.eddenbg.secondbrain",
            "appName": "Second Brain",
            "webDir": "public",
            "server": {
              "androidScheme": "https"
            },
            "plugins": {
              "Filesystem": {
                "directory": "Documents"
              }
            }
          }
          EOF

      - name: Build Android APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK to Release
        uses: actions/upload-artifact@v4
        with:
          name: app-debug.apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Create Release
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: android/app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload as GitHub Release (latest)
        uses: ncipollo/release-action@v1
        if: github.ref == 'refs/heads/claude/second-brain-app-build-v1zKV'
        with:
          artifacts: "android/app/build/outputs/apk/debug/app-debug.apk"
          tag: "latest-build"
          name: "Latest Build"
          bodyFile: ".github/RELEASE_NOTES.md"
          allowUpdates: true
          replacesArtifacts: true
          token: ${{ secrets.GITHUB_TOKEN }}
