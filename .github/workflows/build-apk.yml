name: Build APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        run: npm run build
        env:
          VITE_API_URL: https://eddenbg-second-brain.netlify.app/.netlify/functions
          VITE_FIREBASE_CONFIG: '{"apiKey":"AIzaSyCAi-NJDKLnLKlq_jFVlLmfRqFGBLvXYAI","authDomain":"second-brain-ai-d0c1c.firebaseapp.com","projectId":"second-brain-ai-d0c1c","storageBucket":"second-brain-ai-d0c1c.appspot.com","messagingSenderId":"1090408525657","appId":"1:1090408525657:web:e5c7d5b2c4f3a1b9d2e0f1","databaseURL":"https://second-brain-ai-d0c1c-default-rtdb.firebaseio.com"}'
          API_KEY: ${{ secrets.API_KEY }}
          NOTION_CLIENT_ID: ${{ secrets.NOTION_CLIENT_ID }}

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 34
          build-tools-version: 34.0.0
          ndk-version: 26.1.10909125

      - name: Copy web dist to Android assets
        run: |
          mkdir -p android/app/src/main/assets/public
          cp -r dist/* android/app/src/main/assets/public/

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build APK
        run: cd android && ./gradlew assembleDebug --no-daemon

      - name: Copy APK to root
        run: cp android/app/build/outputs/apk/debug/app-debug.apk SecondBrain.apk

      - name: Delete old latest release
        continue-on-error: true
        run: |
          gh release delete latest --yes || true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create or update release
        uses: softprops/action-gh-release@v2
        with:
          files: SecondBrain.apk
          tag_name: latest
          name: Latest Build
          body: |
            This is the latest automated build of Second Brain APK.

            **Installation Instructions:**
            1. Download SecondBrain.apk from this release
            2. Open file manager and find the downloaded file
            3. Tap to open and select "Install"
            4. If prompted, enable "Install from unknown sources" in Settings
            5. The app will install to your home screen

            Updates will be delivered automatically when you open the app.
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
